# Application Name
spring.application.name=customer-service

# Server Port
server.port=8083

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database Configuration (MySQL for production)
spring.datasource.url=jdbc:mysql://localhost:3306/gymcustomerdb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# Circuit breaker configuration
resilience4j.circuitbreaker.instances.membershipService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.membershipService.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.membershipService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.membershipService.slidingWindowSize=10

# Retry Configuration
resilience4j.retry.instances.membershipService.maxAttempts=3
resilience4j.retry.instances.membershipService.waitDuration=2000